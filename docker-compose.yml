services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rust:
    build: ./rust_backend
    restart: always
    expose:
      - "8766"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      RUST_PORT: 8766
      RUST_BIND: 0.0.0.0
      RUST_LOG: info,sqlx=warn,tower_http=info
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rust
    networks:
      - app_network

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
