{% extends "base.html" %}
{% block title %}Criar conta — ListaIsto{% endblock %}
{% block content %}
<div class="auth-shell">
<div class="auth-card">
  <img src="/static/logo3.png" alt="ListaIsto" class="auth-brand-logo">
  <h1>Criar conta</h1>
  <p class="subtitle">ListaIsto.</p>
  {% if !erro.is_empty() %}<div class="erro">{{ erro }}</div>{% endif %}
  <form method="POST" class="column">
    {% if !next.is_empty() %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <input type="text" name="username" placeholder="Nome de utilizador" required autocomplete="username">
    <input type="password" name="password" placeholder="Palavra-passe" required autocomplete="new-password">
    <button type="submit" class="btn-primary">Registar</button>
  </form>
  <p class="link">Já tem conta? <a href="/entrar/{% if !next.is_empty() %}?next={{ next }}{% endif %}">Entrar</a></p>
</div>
</div>
{% endblock %}
